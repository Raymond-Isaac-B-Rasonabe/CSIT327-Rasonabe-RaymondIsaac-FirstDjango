<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}CampusConnect{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {
            background-color: #f7f8fa;
        }

        .form-control,
        .form-select {
            margin-top: 0.25rem;
            margin-bottom: 0.75rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand bg-white border-bottom">
        <div class="container">
            <a class="navbar-brand fw-semibold" href="{% if user.is_authenticated %}{% url 'dashboard' %}{% else %}{% url 'login' %}{% endif %}">CampusConnect</a>
            <div class="d-flex align-items-center gap-3">
                {% if user.is_authenticated %}
                    <span class="text-secondary small">{{ user.username }}</span>
                    <form method="post" action="{% url 'logout' %}">
                        {% csrf_token %}
                        <button class="btn btn-outline-secondary btn-sm" type="submit">Log out</button>
                    </form>
                {% else %}
                    <a class="btn btn-outline-secondary btn-sm" href="{% url 'login' %}">Log in</a>
                    <a class="btn btn-primary btn-sm" href="{% url 'signup' %}">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container py-4 py-md-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
